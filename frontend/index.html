      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #1f2937;">
        <h1>EconWebCast</h1>
        <p>
          EconWebCast is a web-based data analysis and prediction platform for rental markets. It shows typical rents
          by ZIP code and county for every U.S. metro area Zillow tracks, with interactive maps, charts and data grids.
        </p>
        <p>
          It combines the Zillow Observed Rent Index with U.S. Census American Community Survey data and economic
          indicators such as GDP, unemployment, interest rates, mortgage rates and inflation. Users can forecast rents
          with econometric, machine learning and time-series models, and upload their own cross-sectional, time-series
          or panel data.
        </p>
        <p>Please turn on JavaScript to use the app.</p>
